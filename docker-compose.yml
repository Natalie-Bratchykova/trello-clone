version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: trello_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trello_db
      POSTGRES_USER: trello_user
      POSTGRES_PASSWORD: trello_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trello_user -d trello_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
